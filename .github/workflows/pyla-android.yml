name: PylaAI Android APK

on:
  push:
    branches: [ "pyla-android" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euxo pipefail
          cat pyla-build/src.00 pyla-build/f01.0 pyla-build/f01.1 pyla-build/f01.2 pyla-build/f02.0 pyla-build/f02.1 pyla-build/f02.2 pyla-build/src.03 > /tmp/pyla.b64
          base64 -d /tmp/pyla.b64 > /tmp/pyla.tar.gz
          gzip -t /tmp/pyla.tar.gz
          mkdir -p pyla-project
          tar -xzf /tmp/pyla.tar.gz -C pyla-project
          test -f pyla-project/app/build.gradle.kts
          sed -i 's/compileSdk = 37/compileSdk = 36/g; s/targetSdk = 37/targetSdk = 36/g' pyla-project/app/build.gradle.kts pyla-project/core-runtime/build.gradle.kts pyla-project/core-vision/build.gradle.kts

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Fetch pinned PylaAI models and templates
        working-directory: pyla-project
        run: python3 scripts/fetch_upstream_assets.py

      - name: Build debug APK
        working-directory: pyla-project
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s pyla-project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh pyla-project/app/build/outputs/apk/debug/app-debug.apk
          unzip -t pyla-project/app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: PylaAI-Android-debug
          path: pyla-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
